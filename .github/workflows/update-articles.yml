name: Update Articles Data

on:
  schedule:
    - cron: '0 1 * * 0' # 毎週日曜の午前10時（日本時間）に実行 = UTC 1:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout portfolio
        uses: actions/checkout@v4

      - name: Clone getArticle
        run: git clone --depth 1 https://github.com/ishi720/getArticle.git get-article

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        working-directory: get-article
        run: pip install requests python-dotenv

      - name: Run get_article.py
        working-directory: get-article
        env:
          ZENN_USERNAME: ishi720
          QIITA_USERNAME: ishi720
          NOTE_USERNAME: ishi720
          OUTPUT_FORMAT: json
        run: python get_article.py

      - name: Copy combined_articles.json
        run: cp get-article/combined_articles.json public/data/combined_articles.json

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/combined_articles.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "combined_articles.jsonを自動更新"
            git push
          fi
